# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser for taciturn on limen's Apple release lane (book/releasing.md).
# The lane's sign job runs `just package <version>`, which builds the binary,
# wraps it in Taciturn.app, signs the bundle with the Developer ID identity
# and writes the one asset under .build/assets/; goreleaser, in the publish
# job, builds nothing, verifies that asset through the before hook, checksums
# it, signs the checksums keyless with cosign and publishes. Dry run:
# `just package 0.0.0 && just do release --local --dry-run`.
version: 2

project_name: taciturn

# Under .build/, which the canonical .gitignore covers; goreleaser --clean
# wipes this directory and leaves .build/assets/ alone.
dist: .build/release

before:
  hooks:
    - just verify-assets {{ .Version }}

# cmd/taciturn ships, built and signed by `package` in the job that holds
# the identity; goreleaser builds nothing.
builds:
  - id: taciturn
    main: ./cmd/taciturn
    skip: true

# The version a dry run looks for: `just package 0.0.0` makes the asset.
snapshot:
  version_template: "0.0.0"

# The asset is `package`'s, not an archive goreleaser makes; nothing to catalog.
archives: []

checksum:
  # The single checksums file hermetic verifies the asset against.
  name_template: checksums.txt
  extra_files:
    - glob: .build/assets/*.tar.gz

# Keyless: cosign exchanges the workflow's OIDC token for a short-lived Fulcio
# certificate whose identity is limen-release-apple.yaml at its commit, with
# this repository as the source, and the signature is logged in Rekor. Verify:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp \
#       'https://github.com/farcloser/limen/\.github/workflows/limen-release-apple\.yaml@.*' \
#     checksums.txt
# or, without cosign, naming the reusable workflow that signed, since gh
# otherwise expects a signer in the repository itself:
#   gh attestation verify <asset> --repo forkcloser/taciturn \
#     --signer-workflow farcloser/limen/.github/workflows/limen-release-apple.yaml
signs:
  - cmd: just
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - do
      - release-sign
      - "${artifact}"
      - "${signature}"

release:
  extra_files:
    - glob: .build/assets/*.tar.gz
  # Any prerelease-suffixed tag is published as a GitHub prerelease, so it
  # can never become the repository's "latest release".
  prerelease: auto
  # A retried release overwrites the assets a previous partial attempt
  # uploaded instead of failing on "already_exists"; the release recipe only
  # reuses a tag that still points at HEAD.
  replace_existing_artifacts: true

changelog:
  use: github-native
