# Seeded once by `limen fix`, then the project's own: limen never updates it.
# Realign it by hand when limen's canonical moves, and comment every project
# line so the next alignment keeps it.
#
# The workflow half of the release lane: `just do release vX.Y.Z` verifies
# the tree, creates the SIGNED tag and pushes it; that push runs
# `just do release --ci`, which builds, signs keyless and publishes (defined
# in .limen/just/release.just, not here). Pair with a ruleset restricting who
# can create v* tags: the tag push is the release button.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# One run PER TAG, never cancelled: keyed by ref, not a constant — a constant
# group keeps only the newest pending run, so pushing several tags at once
# silently cancels the older releases. A re-push of the same tag serializes
# behind the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Explicit bash: windows defaults to PowerShell, and bash brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  release:
    # Project line: a Mac, not ubuntu. The agent is cgo against
    # Security.framework and the one target is darwin_arm64 (.release-go.yaml),
    # so the runner that builds it is the platform it runs on.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      # Publish the GitHub release and its assets.
      contents: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a
      # short-lived Fulcio certificate bound to this workflow@tag identity.
      id-token: write
      # Project line: GitHub artifact attestations over the assets, which
      # aqua verifies natively on install (docs/design.md, distribution).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser walks the full history to find the previous tag, where
          # GitHub's generated notes start; the git
          # credential is not needed after checkout (publishing goes through
          # the API with the step-scoped token below).
          persist-credentials: false
          fetch-depth: 0

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua

      - name: Install pinned tools
        # Link-only: the job pays only for what the release recipe runs.
        run: aqua install --only-link

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC1010 # `do` is just's shared-task namespace, not the shell keyword.
          just do release --ci

      # Project step: the attestation names every published asset, the
      # checksums file included, so no asset is unattested. It lives in the
      # repository's attestation store, keyed by digest, so it needs no
      # upload to the release page goreleaser just published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/release/*.tar.gz
            build/release/checksums.txt
